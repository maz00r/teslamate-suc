name: TeslaMate SuC — faktury Supercharger
version: "0.1.0"
slug: teslamate_suc
description: Pobiera faktury z Superchargerów (Tesla Fleet API) i uzupełnia koszty ładowań w TeslaMate. Etap 1 — logowanie Tesla i sonda historii.
url: https://github.com/maz00r/teslamate-suc
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: SuC
options:
  client_id: ""
  client_secret: ""
  region: "eu"
  domain: ""
  redirect_uri: ""
  log_level: "info"
schema:
  client_id: str
  client_secret: password
  region: list(eu|na)
  domain: str
  redirect_uri: url
  log_level: list(debug|info|warning|error)
